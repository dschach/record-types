name: Dependabot Pull Request Title and Approve
on: pull_request_target
permissions:
  pull-requests: write
  contents: write
jobs:
  pull-request-title-change:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      # Checkout the source code
      - name: 'Checkout source code'
        uses: actions/checkout@v7

      - name: 'Fetch Dependabot metadata'
        id: dependabot-fetch
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: 'Split title and update'
        id: split-title
        if: ${{ ! contains(github.event.pull_request.title, '):' ) && contains(github.event.pull_request.title, ':')  && steps.dependabot-fetch.outcome == 'success' }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{github.event.pull_request.html_url}}
        run: |
          echo $TITLE
          title_pt2="${TITLE##*:}"
          title_pt1="${TITLE%%:*}"
          gh pr checkout "$PR_URL" # sets the upstream metadata for `gh pr status`
          packagename="${{ steps.dependabot-fetch.outputs.dependency-names }}"
          #echo "packagename is $packagename"
          #echo "$title_pt1"
          #echo "$title_pt2"
          parensOpen="("
          parensClose="):"
          pr_title=$title_pt1$parensOpen$packagename$parensClose$title_pt2
          echo "FINAL TITLE: $pr_title"
          gh pr edit "$PR_URL" --title "$pr_title" --add-label "dependabot"

  # Approve (but never merge) Dependabot PRs for:
  # - patch updates on prod and indirect dependencies
  # - minor and patch updates on dev dependencies
  dependabot-approve:
    needs: pull-request-title-change
    # Only run for Dependabot PRs
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Fetch Dependabot metadata'
        id: dependabot
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: 'Check approval conditions'
        id: approval
        if: |
          (
            steps.dependabot.outputs.update-type == 'version-update:semver-patch' &&
            contains(fromJSON('["direct:production", "indirect"]'), steps.dependabot.outputs.dependency-type)
          ) || (
            contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.dependabot.outputs.update-type) &&
            steps.dependabot.outputs.dependency-type == 'direct:development'
          )
        run: echo "::notice ::approval conditions satisfied"

      - name: 'Approve PR'
        if: ${{ steps.approval.conclusion == 'success' }}
        run: gh pr review --approve "$PR_URL"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
