name: code-coverage
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "force-app/**"
      - "unpackaged/**"
      - ".github/workflows/apex-tests.yml"
      - ".github/workflows/code-coverage.yml"
jobs:
  # Upload coverage for every commit on main so Codecov has a current baseline for pull requests
  code-coverage:
    uses: ./.github/workflows/apex-tests.yml
    secrets: inherit
