# Unique name for this workflow
name: CI on PR

# Definition when the workflow should run
on:
  workflow_dispatch:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - "force-app/**"
      - "unpackaged/**"
# Jobs to be executed
jobs:
  # Formatting and linting only runs on human-submitted PRs
  format-tests:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      # Checkout the code in the pull request
      - name: "Checkout source code"
        uses: actions/checkout@v7

      - name: "Setup node"
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: "Install NPM"
        run: npm ci

      # Prettier formatting
      - name: "Code formatting verification with Prettier"
        run: npm run prettier:apex:verify

  # Scratch org tests and the Codecov upload live in a reusable workflow shared with code-coverage.yml
  scratch-org-test:
    needs: format-tests
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: ./.github/workflows/apex-tests.yml
    secrets: inherit
